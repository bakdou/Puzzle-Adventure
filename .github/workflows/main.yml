name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Doctor
        run: flutter doctor

      - name: Install dependencies
        run: flutter pub get

      # FORCER LA MIGRATION V2 : Nettoie l'ancien code natif et force l'Embedding V2
      - name: Force Android Embedding V2 Migration
        run: |
          # Supprime les vieux MainActivity java/kotlin
          find android/app/src/main -name "MainActivity.java" -delete
          find android/app/src/main -name "MainActivity.kt" -delete
          
          # Crée un nouveau MainActivity.kt compatible V2
          TARGET_DIR="android/app/src/main/kotlin/com/example/puzzle_adventure"
          mkdir -p "$TARGET_DIR"
          cat << 'EOF' > "$TARGET_DIR/MainActivity.kt"
          package com.example.puzzle_adventure

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity() {
          }
          EOF

          # S'assure que le Manifest contient la meta-data V2
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "flutterEmbedding" "$MANIFEST_PATH"; then
            sed -i '/<\/application>/i \    <meta-data\n        android:name="flutterEmbedding"\n        android:value="2" \/>' "$MANIFEST_PATH"
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
