name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      # APPLICATION DE LA MIGRATION V2 (selon la documentation officielle)
      - name: Apply Android Embedding V2 Migration
        run: |
          # 1. Corriger ou recréer MainActivity.kt selon les standards V2
          TARGET_DIR="android/app/src/main/kotlin/com/example/puzzle_adventure"
          mkdir -p "$TARGET_DIR"
          cat << 'EOF' > "$TARGET_DIR/MainActivity.kt"
          package com.example.puzzle_adventure

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity() {
          }
          EOF

          # 2. S'assurer que le Manifest utilise ${applicationName} et la meta-data v2
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            # Remplace l'éventuel FlutterApplication par ${applicationName}
            sed -i 's/android:name="io.flutter.app.FlutterApplication"/android:name="${applicationName}"/g' "$MANIFEST_PATH"
            
            # Ajoute flutterEmbedding si absent
            if ! grep -q "flutterEmbedding" "$MANIFEST_PATH"; then
              sed -i '/<\/application>/i \    <meta-data\n        android:name="flutterEmbedding"\n        android:value="2" \/>' "$MANIFEST_PATH"
            fi
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
