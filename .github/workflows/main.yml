name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Permet de lancer le build manuellement depuis l'onglet Actions de GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Cloner le code source du dépôt
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Installer Java (JDK 17 requis pour Gradle 8 / Flutter moderne)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Installer le SDK Flutter (version stable récente)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x' # S'adapte parfaitement aux projets de 2024+
          channel: 'stable'
          cache: true

      # 4. Vérifier la version de Flutter installée
      - name: Doctor
        run: flutter doctor

      # 5. Récupérer les dépendances du projet (pub get)
      - name: Install dependencies
        run: flutter pub get

      # 6. Compiler l'application en mode release (génère l'APK non signé)
      - name: Build APK
        run: flutter build apk --release

      # 7. Télécharger l'APK généré directement depuis les artefacts GitHub
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
