name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Doctor
        run: flutter doctor

      - name: Install dependencies
        run: flutter pub get

      # CORRECTION AUTOMATIQUE : Force l'Android Embedding V2 requis par les plugins récents
      - name: Fix Android Embedding V2
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ] && ! grep -q "flutterEmbedding" "$MANIFEST_PATH"; then
            echo "Injection de la meta-data flutterEmbedding v2..."
            sed -i '/<\/application>/i \    <meta-data\n        android:name="flutterEmbedding"\n        android:value="2" \/>' "$MANIFEST_PATH"
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
